name: probe-issuer-downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe issuer downloads
        run: bash scripts/probe_downloads.sh

      - name: Print summary
        run: cat probe/summary.txt

      - name: Commit probe results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "probe: issuer download results from Actions runner"
            git push
          fi
